[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webscan"
version = "1.0.0"
description = "A professional, modular web vulnerability scanner for authorized security testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tawfiq Imam" }]
keywords = ["security", "vulnerability-scanner", "pentest", "web-security", "infosec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "dnspython>=2.4.0",
    "colorama>=0.4.6",
    "jinja2>=3.1.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "flake8>=6.1.0", "black>=23.0.0"]

[project.urls]
Homepage = "https://github.com/Tawfiqimam0/webscan"
Repository = "https://github.com/Tawfiqimam0/webscan"
Issues = "https://github.com/Tawfiqimam0/webscan/issues"

[project.scripts]
webscan = "webscan.cli:main"

[tool.setuptools.packages.find]
include = ["webscan*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
